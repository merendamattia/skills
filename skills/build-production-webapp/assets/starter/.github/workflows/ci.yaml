name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: production_webapp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d production_webapp"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      NODE_ENV: test
      RUN_INTEGRATION: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/production_webapp
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:17421
      FRONTEND_URL: http://localhost:17420
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: 1.3.14}
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run db:deploy
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
